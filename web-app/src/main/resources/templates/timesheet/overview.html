<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title th:text="${title}">Timesheet</title>
    <th:block layout:fragment="head">
        <link rel="stylesheet" th:href="@{/assets/timesheet/timesheet.css}">
    </th:block>
</head>

<body>
    <div layout:fragment="content" class="timesheet-container" th:data-current-date="${currentDate}">
        <div class="timesheet-header">
            <h1>Weekly Timesheet</h1>
            <div class="week-navigation">
                <a th:href="@{/timesheet(targetDate=${currentDate.minusWeeks(1)})}" class="nav-button">
                    &larr; Previous Week
                </a>
                <span class="current-week" th:text="${#temporals.format(currentDate, 'MMM dd, yyyy')}">Current Week</span>
                <a th:href="@{/timesheet(targetDate=${currentDate.plusWeeks(1)})}" class="nav-button">
                    Next Week &rarr;
                </a>
            </div>
        </div>

        <div class="employee-selector">
            <label for="employee-input">Employee:</label>
            <input type="text" id="employee-input" list="employee-list" placeholder="Type to search or enter new employee name" />
            <datalist id="employee-list">
                <option th:each="employee : ${employees}" th:value="${employee}">
            </datalist>
            <button id="add-employee-btn" onclick="addNewEmployee()" style="display: none;">Add New Employee</button>
        </div>

        <div class="project-activity-selector">
            <div class="form-row">
                <select id="new-project">
                    <option value="">Select Project</option>
                    <option th:each="project : ${projects}" 
                            th:value="${project}" 
                            th:text="${project}">Project</option>
                    <option value="__new__">+ Add New Project</option>
                </select>
                
                <select id="new-activity">
                    <option value="">Select Activity</option>
                    <option th:each="activity : ${activities}" 
                            th:value="${activity}" 
                            th:text="${activity}">Activity</option>
                    <option value="__new__">+ Add New Activity</option>
                </select>
                
                <button onclick="addNewRow()">Add Row</button>
            </div>
        </div>

        <div class="timesheet-grid">
            <table class="timesheet-table">
                <thead>
                    <tr>
                        <th>Project</th>
                        <th>Activity</th>
                        <th th:with="mondayDate=${currentDate.with(T(java.time.temporal.TemporalAdjusters).previousOrSame(T(java.time.DayOfWeek).MONDAY))}">
                            Mon<br/><span th:text="${#temporals.format(mondayDate, 'MM/dd')}" class="date-label"></span>
                        </th>
                        <th th:with="tuesdayDate=${currentDate.with(T(java.time.temporal.TemporalAdjusters).previousOrSame(T(java.time.DayOfWeek).MONDAY)).plusDays(1)}">
                            Tue<br/><span th:text="${#temporals.format(tuesdayDate, 'MM/dd')}" class="date-label"></span>
                        </th>
                        <th th:with="wednesdayDate=${currentDate.with(T(java.time.temporal.TemporalAdjusters).previousOrSame(T(java.time.DayOfWeek).MONDAY)).plusDays(2)}">
                            Wed<br/><span th:text="${#temporals.format(wednesdayDate, 'MM/dd')}" class="date-label"></span>
                        </th>
                        <th th:with="thursdayDate=${currentDate.with(T(java.time.temporal.TemporalAdjusters).previousOrSame(T(java.time.DayOfWeek).MONDAY)).plusDays(3)}">
                            Thu<br/><span th:text="${#temporals.format(thursdayDate, 'MM/dd')}" class="date-label"></span>
                        </th>
                        <th th:with="fridayDate=${currentDate.with(T(java.time.temporal.TemporalAdjusters).previousOrSame(T(java.time.DayOfWeek).MONDAY)).plusDays(4)}">
                            Fri<br/><span th:text="${#temporals.format(fridayDate, 'MM/dd')}" class="date-label"></span>
                        </th>
                        <th th:with="saturdayDate=${currentDate.with(T(java.time.temporal.TemporalAdjusters).previousOrSame(T(java.time.DayOfWeek).MONDAY)).plusDays(5)}">
                            Sat<br/><span th:text="${#temporals.format(saturdayDate, 'MM/dd')}" class="date-label"></span>
                        </th>
                        <th th:with="sundayDate=${currentDate.with(T(java.time.temporal.TemporalAdjusters).previousOrSame(T(java.time.DayOfWeek).MONDAY)).plusDays(6)}">
                            Sun<br/><span th:text="${#temporals.format(sundayDate, 'MM/dd')}" class="date-label"></span>
                        </th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="timesheet-body">
                    <!-- Existing entries will be populated here -->
                    <tr th:each="entry : ${entries}" 
                        class="main-row"
                        th:data-employee="${entry.employeeName}"
                        th:data-project="${entry.project}"
                        th:data-activity="${entry.activity}">
                        <td th:text="${entry.project}">Project</td>
                        <td th:text="${entry.activity}">Activity</td>
                        <td><input type="number" step="0.25" min="0" max="24" class="hour-input" data-day="1" 
                                   th:value="${entry.hours[0] != null ? entry.hours[0] : ''}"
                                   th:data-comment="${entry.comments[0] != null ? entry.comments[0] : ''}"></td>
                        <td><input type="number" step="0.25" min="0" max="24" class="hour-input" data-day="2" 
                                   th:value="${entry.hours[1] != null ? entry.hours[1] : ''}"
                                   th:data-comment="${entry.comments[1] != null ? entry.comments[1] : ''}"></td>
                        <td><input type="number" step="0.25" min="0" max="24" class="hour-input" data-day="3" 
                                   th:value="${entry.hours[2] != null ? entry.hours[2] : ''}"
                                   th:data-comment="${entry.comments[2] != null ? entry.comments[2] : ''}"></td>
                        <td><input type="number" step="0.25" min="0" max="24" class="hour-input" data-day="4" 
                                   th:value="${entry.hours[3] != null ? entry.hours[3] : ''}"
                                   th:data-comment="${entry.comments[3] != null ? entry.comments[3] : ''}"></td>
                        <td><input type="number" step="0.25" min="0" max="24" class="hour-input" data-day="5" 
                                   th:value="${entry.hours[4] != null ? entry.hours[4] : ''}"
                                   th:data-comment="${entry.comments[4] != null ? entry.comments[4] : ''}"></td>
                        <td><input type="number" step="0.25" min="0" max="24" class="hour-input" data-day="6" 
                                   th:value="${entry.hours[5] != null ? entry.hours[5] : ''}"
                                   th:data-comment="${entry.comments[5] != null ? entry.comments[5] : ''}"></td>
                        <td><input type="number" step="0.25" min="0" max="24" class="hour-input" data-day="7" 
                                   th:value="${entry.hours[6] != null ? entry.hours[6] : ''}"
                                   th:data-comment="${entry.comments[6] != null ? entry.comments[6] : ''}"></td>
                        <td class="total-hours">0.00</td>
                        <td>
                            <button class="delete-row" onclick="deleteRow(this)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>


        <div class="actions">
            <button onclick="saveTimesheet()" class="save-button">Save All Changes</button>
            <a th:href="@{/timesheet/report}" class="report-button">Generate Report</a>
            <a th:href="@{/timesheet/monthly-report}" class="report-button">Monthly Report</a>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:src="@{/assets/timesheet/timesheet.js}"></script>
    </th:block>
</body>
</html>
